[package]
name = "deck-cli"
description = "Native tools for the Afterimage visual deck: demo track generator and offline fingerprinting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "deck-cli"
path = "src/main.rs"

[dependencies]
deck-dsp = { path = "../deck-dsp" }
clap = { version = "4", features = ["derive"] }
hound = "3"

[dev-dependencies]
tempfile = "3"
